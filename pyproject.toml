[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yottaflex-claims"
version = "1.0.0"
description = "Deterministic insurance claims processing challenge prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
claims = "claimflow.cli:main"

[tool.setuptools.packages.find]
include = ["claimflow*"]

[tool.setuptools.package-data]
claimflow = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
